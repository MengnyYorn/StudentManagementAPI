<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Student Management System</h2>

<div class="form-container">
    <h3 style="margin-top:0;">Add / Update Student</h3>
    <input type="hidden" id="studentId">
    <input type="text" id="name" placeholder="Full Name">
    <input type="email" id="email" placeholder="Email Address">
    <input type="text" id="phone" placeholder="Phone Number">

    <select id="gender">
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
    </select>

    <input type="text" id="department" placeholder="Department (e.g. Computer Science)">
    <input type="date" id="enrollmentDate" placeholder="Enrollment Date">

    <button id="saveBtn" class="submit-btn" onclick="saveStudent()">Add Student</button>
</div>

<h3>Student List</h3>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Gender</th>
        <th>Department</th>
        <th>Enrollment Date</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody id="studentTable"></tbody>
</table>

<script>
    const API_URL = "http://localhost:8080/api/students";

    function fetchStudents() {
        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                const table = document.getElementById("studentTable");
                table.innerHTML = "";
                data.forEach(student => {
                    table.innerHTML += `
                            <tr>
                                <td>${student.id}</td>
                                <td>${student.name || ''}</td>
                                <td>${student.email || ''}</td>
                                <td>${student.phone || ''}</td>
                                <td>${student.gender || ''}</td>
                                <td>${student.department || ''}</td>
                                <td>${student.enrollmentDate || ''}</td>
                                <td>
                                    <div class="actions-cell">
                                        <button class="edit-btn" onclick="populateForm(${student.id}, '${student.name || ''}', '${student.email || ''}', '${student.phone || ''}', '${student.gender || ''}', '${student.department || ''}', '${student.enrollmentDate || ''}')">Edit</button>
                                        <button class="delete-btn" onclick="deleteStudent(${student.id})">Delete</button>
                                    </div>
                                </td>
                            </tr>
                        `;
                });
            });
    }

    function saveStudent() {
        const id = document.getElementById("studentId").value;
        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const phone = document.getElementById("phone").value;
        const gender = document.getElementById("gender").value;
        const department = document.getElementById("department").value;
        const enrollmentDate = document.getElementById("enrollmentDate").value;

        if (!name || !email) return;

        const payload = { name, email, phone, gender, department, enrollmentDate };
        const method = id ? "PUT" : "POST";
        const url = id ? `${API_URL}/${id}` : API_URL;

        fetch(url, {
            method: method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }).then(() => {
            resetForm();
            fetchStudents();
        });
    }

    function populateForm(id, name, email, phone, gender, department, enrollmentDate) {
        document.getElementById("studentId").value = id;
        document.getElementById("name").value = name;
        document.getElementById("email").value = email;
        document.getElementById("phone").value = phone;
        document.getElementById("gender").value = gender;
        document.getElementById("department").value = department;
        document.getElementById("enrollmentDate").value = enrollmentDate;
        document.getElementById("saveBtn").innerText = "Update Student";
    }

    function deleteStudent(id) {
        fetch(`${API_URL}/${id}`, { method: "DELETE" })
            .then(() => fetchStudents());
    }

    function resetForm() {
        document.getElementById("studentId").value = "";
        document.getElementById("name").value = "";
        document.getElementById("email").value = "";
        document.getElementById("phone").value = "";
        document.getElementById("gender").value = "";
        document.getElementById("department").value = "";
        document.getElementById("enrollmentDate").value = "";
        document.getElementById("saveBtn").innerText = "Add Student";
    }

    fetchStudents();
</script>
</body>
</html>
